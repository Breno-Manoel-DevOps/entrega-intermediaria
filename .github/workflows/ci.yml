name: CI — Build, Lint e Testes

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read      # necessário para ler o código
  checks: write       # necessário para criar check runs (relatórios)
  pull-requests: write # necessário para comentar em PRs

jobs:
  build-and-test:
    name: Build e Testes (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build e execução dos testes
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publicar relatório de testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cep-finder-jar
          path: target/*.jar
          retention-days: 7