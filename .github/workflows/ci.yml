name: CI — Build, Lint e Testes

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build e Testes (Java 17)
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout repositório
        uses: actions/checkout@v4

      # 2. Configurar JDK 17
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build + Testes (inclui testes de integração)
      - name: Build e execução dos testes
        run: mvn --batch-mode --no-transfer-progress verify

      # 4. Publicar relatório de testes (visível na aba Actions)
      - name: Publicar relatório de testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      # 5. Upload do JAR como artefato
      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cep-finder-jar
          path: target/*.jar
          retention-days: 7
