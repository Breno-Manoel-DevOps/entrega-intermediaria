spring.application.name=cep-finder

# URL base da API ViaCEP (sobrescrita nos testes via WireMock)
viacep.base-url=https://viacep.com.br

# Porta padrão
server.port=8080

# %% Datasource (Supabase / CI defaults) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
# By default use an in-memory H2 database for tests and CI. Override by
# setting `SPRING_DATASOURCE_URL` (e.g. a Supabase JDBC URL) in the
# deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
# Allow overriding driver when using Postgres in production
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Hibernate Dialect para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configurações adicionais de JPA (alterado de create-drop para update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator — apenas endpoint de saúde exposto (usado pelo Render.com)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
