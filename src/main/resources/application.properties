spring.application.name=cep-finder

# URL base da API ViaCEP (sobrescrita nos testes via WireMock)
viacep.base-url=https://viacep.com.br

# Porta padrão
server.port=8080

# %% Supabase (PostgreSQL) %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
# Variáveis de ambiente coders) para local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://<SEU_HOST_DO_SUPABASE>:5432/
postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:<SUA_SENHA_DO_BANCO>}
# Hibernate Dialect para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Configurações adicionais de JPA (alterado de create-drop para update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Actuator — apenas endpoint de saúde exposto (usado pelo Render.com)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
