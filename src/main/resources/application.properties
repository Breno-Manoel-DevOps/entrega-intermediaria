spring.application.name=cep-finder

# URL base da API ViaCEP (sobrescrita nos testes via WireMock)
viacep.base-url=https://viacep.com.br

# Porta padrão
server.port=8080

# ── H2 — Banco em memória ──────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cepfinder
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Actuator — apenas endpoint de saúde exposto (usado pelo Render.com)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
